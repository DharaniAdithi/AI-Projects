openapi: 3.0.3
info:
  title: Quiz Generator
  version: 1.0.0
  description: |
    API for an agentic workflow that automates quiz generator and take user output through terminal and validate the answers and finally return feedback

servers:
  - url: http://localhost:8000/api/v1/quiz
    description: Localhost server

tags:
  - name: Quiz Generator
    description: |
      API for orchestrating multiple AI agents including quiz, Reviewer,
      to generate quiz and validate answers

paths:
  /pipeline/quiz:
    post:
      summary: Generate, review, and refine code using a multi-agent workflow
      tags: [multi-agent pipeline]
      description: >
        Accepts a user request identify the user intent and generating quizes and get the user answers through terminal and validate the user answers and return the feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRequest'
            example:
              user_query: "python basics"
              user_id: "1"
              num_questions: 5
              difficulty: medium
      responses:
        "200":
          description: Final feedback generated by review agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineResponse'
              example:
                code: 200
                status: success
                message: "Quiz conducted successfully"
                data: 
                    output: |
                      "your score is 5/5. keep it up"
                request_id: "e1d9f2a7-42bd-4b93-b5f4-96c4b1f7c2aa"
                timestamp: "2026-03-24T15:20:00Z"

        "400":
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
              example:
                code: 400
                status: error
                message: "Invalid request payload"
                error:
                  error: |
                    - field: "user_request"
                    message: "Field is required"
                request_id: "a5f7c2d1-9b4a-4a61-9c20-6c99a2dff001"
                timestamp: "2026-03-24T15:20:00Z"

        "500":
          description: Internal server error during agent execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
              example:
                code: 500
                status: error
                message: "Agent orchestration failed"
                error: 
                  error: "Unhandled exception in Review Agent"
                request_id: "9cfae01d-6f90-41db-9a18-81c3fdf02bbb"
                timestamp: "2026-03-24T15:22:00Z"

components:
  schemas:
    PipelineRequest:
      type: object
      required:
        - user_query
        - user_id
      properties:
        user_query:
          type: string
          description: User's coding  request
          example: "python basics"
        user_id:
          type: string
          description: User's unique identifier
          example: "1"
        difficulty:
          type: string
          description: mention a difficulty level it may be a easy | medium | hard
          example: "easy"
        num_questions: 
          type: integer
          description: number of question
          example: 5

    PipelineResponse:
      type: object
      description: Standard response returned after agentic execution
      properties:
        code:
          type: integer
          example: 200
        status:
          type: string
          example: success
        message:
          type: string
          example: Quiz conducted successfully
        data:
          type: object
          properties:
            code:
              type: "string"
              example:  |
                        "your score is 5/5. keep it up" 
        error:
          type: object
          properties:
            error:
              type: string

        request_id:
          type: string
          example: "uuid-string"
        timestamp:
              type: string
              format: date-time
              example: "2026-03-24T15:20:00Z"


    APIResponse:
      type: object
      properties:
        code:
          type: integer
        status:
          type: string
        message:
          type: string
        data:
          type: object
        error:
          type: object
          properties:
            error:
              type: string
        request_id:
          type: string
        timestamp:
              type: string
